<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stack-Based Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='calculator.js') }}" defer></script>
    <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</head>

<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">Flask starter</p>
            <h1>Stack-Based Calculator</h1>
            <p class="intro">Enter an expression or use the keypad.</p>
        </header>

        <form id="calculator-form" class="calculator" action="/calculate" method="post">
            <section class="calculator-display" aria-label="Calculator display">
                <label for="expression">Calculating:</label>
                <input id="expression" name="expression" type="text" placeholder="Enter Expression" autocomplete="off">
                <output class="calculator-result" aria-live="polite">Result</output>
            </section>

            <section class="calculator-controls" aria-label="Calculator controls">
                <button type="button" name="key" value="sign"
                    onclick="expressionInput.value = expressionInput.value ? '-' + expressionInput.value : expressionInput.value">+/-</button>
                <button type="button" name="key" value="backspace" aria-label="Backspace"
                    onclick="expressionInput.value = expressionInput.value.slice(0, -1)">⌫</button>
                <button type="button" name="key" value="clear" id="clear">AC</button>
                <button type="submit" name="key" value="equals" id="evaluate">=</button>
            </section>

            <section class="calculator-keypad" aria-label="Calculator keypad">
                <div class="digit-keys" aria-label="Numbers">
                    <button type="button" name="digit1" value="1" onclick="expressionInput.value += '1'">1</button>
                    <button type="button" name="digit2" value="2" onclick="expressionInput.value += '2'">2</button>
                    <button type="button" name="digit3" value="3" onclick="expressionInput.value += '3'">3</button>
                    <button type="button" name="digit4" value="4" onclick="expressionInput.value += '4'">4</button>
                    <button type="button" name="digit5" value="5" onclick="expressionInput.value += '5'">5</button>
                    <button type="button" name="digit6" value="6" onclick="expressionInput.value += '6'">6</button>
                    <button type="button" name="digit7" value="7" onclick="expressionInput.value += '7'">7</button>
                    <button type="button" name="digit8" value="8" onclick="expressionInput.value += '8'">8</button>
                    <button type="button" name="digit9" value="9" onclick="expressionInput.value += '9'">9</button>
                    <button type="button" name="digit0" value="0" onclick="expressionInput.value += '0'">0</button>
                    <button type="button" name="decimal" value="." onclick="expressionInput.value += '.'">.</button>
                    <button type="button" name="darkMode" value="theme" aria-label="Toggle dark mode"
                        onclick="toggleDarkMode()">🌙</button>
                </div>

                <div class="operator-keys" aria-label="Operators">
                    <button type="button" name="key" value="+" onclick="expressionInput.value += '+'">+</button>
                    <button type="button" name="key" value="-" onclick="expressionInput.value += '-'">-</button>
                    <button type="button" name="key" value="*" onclick="expressionInput.value += '*'">*</button>
                    <button type="button" name="key" value="/" onclick="expressionInput.value += '/'">/</button>
                </div>
            </section>
        </form>

        <section class="history" aria-labelledby="history-heading">
            <div class="history-header">
                <h2 id="history-heading">Local history</h2>
                <button type="button" id="clear-history">Clear history</button>
            </div>
            <p id="history-status" class="history-status" aria-live="polite"></p>
            <ol id="history-list" class="history-list"></ol>
        </section>

        <details class="debug-controls">
            <summary>Debug options</summary>
            <label>
                <input type="checkbox" name="debug" form="calculator-form">
                Enable debug logging
            </label>
        </details>
    </main>
</body>

</html>
